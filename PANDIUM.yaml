version: 0.4
base: Node
build: npm install
run: node .
configs:
  schema:
    properties:
      free_text_config_1:
        type: string
      free_text_config_2:
        type: string
      upload_receipts:
        type: boolean
        default: true
      include_tax_on_tx_lines:
        type: boolean
    type: object
  uischema:
    elements:
    - label: Free Text Field 1
      scope: '#/properties/free_text_config_1'
      type: Control
    - label: Free Text Field 2
      scope: '#/properties/free_text_config_2'
      type: Control
    - label: Upload Receipts
      scope: '#/properties/upload_receipts'
      type: Control
      admin: true
    - label: Include Tax on Transaction Lines
      scope: '#/properties/include_tax_on_tx_lines'
      type: Control
    type: VerticalLayout